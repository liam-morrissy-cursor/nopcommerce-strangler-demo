rules:
  - id: hardcoded-credential-literal
    languages: [csharp]
    severity: ERROR
    message: $NAME is assigned a literal that looks like a real credential.
    metadata:
      title: Hardcoded credential in source code
      vulnscan_severity: high
      cwe: "CWE-798"
      why: Credentials committed to source are readable by anyone with repo access and cannot be rotated without a code change.
      fix_hint: Load the value from configuration (appsettings via user-secrets or environment variables, or a key vault) and rotate the exposed credential.
    patterns:
      - pattern-either:
          - pattern: $NAME = "$VAL"
          - pattern: $O.$NAME = "$VAL"
          - pattern: $T $NAME = "$VAL";
          - pattern: |
              const $T $NAME = "$VAL";
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)^_?\w*(password|passwd|pwd|secret|apikey|accesskey|secretkey|privatekey|accesstoken|authtoken|bearertoken)$
      - metavariable-regex:
          metavariable: $VAL
          # 12+ chars, no whitespace or format/resource-key punctuation, at least one letter and one digit
          regex: ^(?=.*[A-Za-z])(?=.*\d)[^\s{}.<>]{12,}$
      - metavariable-regex:
          metavariable: $VAL
          regex: (?i)^(?!.*(example|changeme|placeholder|your|xxxx|dummy|sample|test)).*$

  - id: hardcoded-secret-token-format
    languages: [generic]
    severity: ERROR
    message: A string matching a well-known secret format was found.
    metadata:
      title: Secret with a well-known token format committed to the repo
      vulnscan_severity: critical
      cwe: "CWE-798"
      why: Provider-issued keys in the repo grant direct access to the provider account to anyone who can read the code.
      fix_hint: Revoke and rotate the key at the provider, remove it from the file, and load it from a secret store or environment variable.
    paths:
      include:
        - "*.cs"
        - "*.json"
        - "*.config"
        - "*.xml"
        - "*.yml"
        - "*.yaml"
        - "*.env"
        - "*.cshtml"
        - "*.js"
    pattern-either:
      - pattern-regex: \bAKIA[0-9A-Z]{16}\b
      - pattern-regex: -----BEGIN (RSA |EC |DSA |OPENSSH |ENCRYPTED )?PRIVATE KEY-----
      - pattern-regex: \bxox[abposr]-[0-9A-Za-z-]{10,}
      - pattern-regex: https://hooks\.slack\.com/services/T[A-Z0-9]{6,}/B[A-Z0-9]{6,}/[A-Za-z0-9]{20,}
      - pattern-regex: \bgh[pousr]_[A-Za-z0-9]{36}\b
      - pattern-regex: \b(sk|rk)_live_[0-9a-zA-Z]{24,}\b
      - pattern-regex: \bAIza[0-9A-Za-z_\-]{35}\b

  - id: connection-string-with-password
    languages: [generic]
    severity: WARNING
    message: A connection string with an inline password is committed to the repo.
    metadata:
      title: Database connection string with inline password
      vulnscan_severity: high
      cwe: "CWE-798"
      why: An inline database password in a committed file gives anyone with repo access a working database credential.
      fix_hint: Move the connection string to user-secrets, an environment variable or App_Data/appsettings.json outside source control, and rotate the password.
    paths:
      include:
        - "*.json"
        - "*.config"
        - "*.cs"
    patterns:
      - pattern-regex: (?i)"[^"\n]*\b(server|data source|host)\s*=[^;"\n]+;[^"\n]*\b(password|pwd)\s*=\s*(?P<PW>[^;"'\s]{4,})
      - metavariable-regex:
          metavariable: $PW
          regex: (?i)^(?!(\{|\$\{|%|<|\*+$|password$|yourpassword|changeme|example)).*
