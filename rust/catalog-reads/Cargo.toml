[package]
name = "catalog-reads"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
publish = false

[[bin]]
name = "catalog-reads"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
icu_collator = "1.5"
icu_locid = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["any", "derive", "postgres", "sqlite", "runtime-tokio"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
